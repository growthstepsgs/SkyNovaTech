{% extends "admin_base.html" %}
{% block title %}Edit blog post — Admin — Sky Nova Tech{% endblock %}

{% block admin_content %}
<section class="section">
    <h2>Edit blog post</h2>
    <form action="{{ url_for('admin_edit_blog', post_id=post.id) }}" method="POST" class="admin-card">
        <div class="admin-form-grid">
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Post title</label>
                <input type="text" name="title" value="{{ post.title }}" required>
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Cover image URL</label>
                <input type="url" name="cover_image" value="{{ post.cover_image or '' }}">
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Content</label>
                <textarea name="content" rows="14" required>{{ post.content }}</textarea>
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label><input type="checkbox" name="is_published" {% if post.is_published %}checked{% endif %}> Published</label>
            </div>
        </div>
        <div class="admin-form-actions">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a href="{{ url_for('admin_blogs') }}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}

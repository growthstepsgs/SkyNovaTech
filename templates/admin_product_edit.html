{% extends "admin_base.html" %}
{% block title %}Edit product — Admin — Sky Nova Tech{% endblock %}

{% block admin_content %}
<section class="section">
    <h2>Edit product</h2>
    <form action="{{ url_for('admin_edit_product', product_id=product.id) }}" method="POST" class="admin-card" enctype="multipart/form-data">
        <input type="hidden" name="current_image_url" value="{{ product.image_url or '' }}">
        <div class="admin-form-grid">
            <div class="form-group">
                <label>Product name</label>
                <input type="text" name="name" value="{{ product.name }}" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <input type="text" name="category" value="{{ product.category or '' }}">
            </div>
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" name="price" step="0.01" value="{{ product.price }}" required>
            </div>
            <div class="form-group">
                <label>Stock quantity</label>
                <input type="number" name="stock" min="0" value="{{ product.stock or 0 }}">
            </div>

            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Current image</label>
                {% if product.image_url %}
                    <img src="{{ product.image_url }}" alt="" style="max-width:160px; border-radius:8px; display:block; margin-bottom:.5rem;">
                {% else %}
                    <small class="muted">No image yet.</small>
                {% endif %}
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Replace image</label>
                <input type="file" name="image_file" accept="image/png, image/jpeg, image/webp, image/gif">
                <small>Leave empty to keep the current image.</small>
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Or paste new image URL</label>
                <input type="url" name="image_url" placeholder="https://example.com/image.jpg">
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Description</label>
                <textarea name="description" rows="4">{{ product.description or '' }}</textarea>
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label><input type="checkbox" name="is_active" {% if product.is_active %}checked{% endif %}> Active (visible in the shop)</label>
            </div>
        </div>
        <div class="admin-form-actions">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a href="{{ url_for('admin_products') }}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}

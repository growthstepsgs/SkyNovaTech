{% extends "base.html" %}
{% block title %}Blog{% endblock %}
{% block content %}
<section class="section">
    <h1>Blog</h1>
    <div class="blog-grid">
        {% for post in posts %}
        <div class="blog-card">
            {% if post.cover_image %}<img src="{{ post.cover_image }}" alt="{{ post.title }}">{% endif %}
            <h3><a href="{{ url_for('blog_detail', post_id=post.id) }}">{{ post.title }}</a></h3>
            <p>{{ post.content[:150] }}...</p>
        </div>
        {% else %}
        <p>No blog posts yet.</p>
        {% endfor %}
    </div>
</section>
{% endblock %}
